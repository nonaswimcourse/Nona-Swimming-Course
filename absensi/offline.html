<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#234a84">
    <title>Offline - Absensi NSC</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-180x180.png">
    <style>
        :root {
            --primary: #234a84;
            --bg: #f4f6f9;
            --text: #0f172a;
            --muted: #64748b;
        }

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at top left, rgba(35, 74, 132, 0.12), transparent 34%),
                linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
            color: var(--text);
        }

        .offline-card {
            width: min(100%, 440px);
            padding: 32px;
            background: rgba(255, 255, 255, .96);
            border: 1px solid #dbe3ef;
            border-radius: 24px;
            box-shadow: 0 18px 45px rgba(15, 23, 42, .12);
            text-align: center;
        }

        img {
            width: 92px;
            height: 92px;
            border-radius: 22px;
            margin: 0 auto 18px;
        }

        h1 {
            margin: 0 0 10px;
            color: var(--primary);
            font-size: 24px;
            line-height: 1.2;
        }

        p {
            margin: 0 0 20px;
            color: var(--muted);
            line-height: 1.6;
            font-size: 15px;
        }

        button {
            border: 0;
            border-radius: 999px;
            padding: 12px 18px;
            background: var(--primary);
            color: #fff;
            font-weight: 800;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main class="offline-card">
        <img src="icons/icon-192x192.png" alt="Logo Absensi NSC">
        <h1>Aplikasi sedang offline</h1>
        <p>Koneksi internet tidak tersedia. Halaman utama dapat terbuka dari cache, tetapi sinkronisasi Supabase membutuhkan internet.</p>
        <button type="button" onclick="window.location.reload()">Coba Lagi</button>
    </main>
</body>
</html>
