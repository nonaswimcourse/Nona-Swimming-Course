<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#234a84">
  <link rel="manifest" href="/absensi/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/absensi/apple-touch-icon.png">
  <title>Offline - Absensi NSC</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f9;color:#0f172a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(92vw,430px);background:#fff;border-radius:22px;padding:28px;text-align:center;box-shadow:0 18px 45px rgba(15,23,42,.14)}
    img{width:86px;height:86px;border-radius:20px;margin:0 auto 16px}
    h1{margin:0 0 10px;font-size:24px;color:#234a84}
    p{margin:0 0 18px;color:#64748b;line-height:1.6}
    button{border:0;border-radius:999px;background:#234a84;color:#fff;padding:12px 18px;font-weight:800}
  </style>
</head>
<body>
  <main>
    <img src="/absensi/icons/icon-192x192.png" alt="NSC">
    <h1>Aplikasi sedang offline</h1>
    <p>Koneksi internet tidak tersedia. Periksa jaringan, lalu buka ulang aplikasi.</p>
    <button onclick="location.reload()">Coba Lagi</button>
  </main>
</body>
</html>
