<script>
const TOTAL_PERTEMUAN = 12;
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwu4Lk0gwUWvVWIeKNUIyqzUIcl4VM_5QEC_S9SPVZAIZt7w0tFZfR1rgMREHyqVL_j7g/exec";

let dataRekap = [];
let selectNamaControl;

document.addEventListener("DOMContentLoaded", function() {
    selectNamaControl = new TomSelect("#nama", {
        create: false,
        sortField: { field: "text", direction: "asc" },
        placeholder: "Ketik / Pilih Nama Siswa...",
        allowEmptyOption: true,
        onChange: function(value) {
            if(value) {
                if(selectNamaControl) { selectNamaControl.blur(); }
                document.activeElement.blur(); 
            }
        }
    });
    checkLoginSession();
    muatDataDariCloud();
});

async function muatDataDariCloud() {
    try {
        dataRekap = JSON.parse(localStorage.getItem("dataRekap")) || [];
        renderTable();

        const response = await fetch(WEB_APP_URL + "?action=read");
        if (response.ok) {
            const dataDariSheets = await response.json();
            if (dataDariSheets && dataDariSheets.length > 0) {
                dataRekap = dataDariSheets;
                try { localStorage.setItem("dataRekap", JSON.stringify(dataRekap)); } catch(e){}
                renderTable();
            }
        }
    } catch (e) { console.log("Menggunakan backup data lokal."); }
}

function togglePasswordVisibility() {
    const passwordInput = document.getElementById("loginPassword");
    const eyeIcon = document.getElementById("eyeIcon");
    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        eyeIcon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
        passwordInput.type = "password";
        eyeIcon.classList.replace("fa-eye-slash", "fa-eye");
    }
}

async function generateSHA256(string) {
    const msgBuffer = new TextEncoder().encode(string);                    
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function handleLogin(event) {
    event.preventDefault(); 
    const email = document.getElementById("loginEmail").value.trim().toLowerCase();
    const password = document.getElementById("loginPassword").value;

    if (email !== "nonaswimmingcourse@gmail.com" || await generateSHA256(password) !== "3d32f1b4eec6aac2520a664ae8b746e46f83d5baecf81e030e47a9db5c8c7c83") {
        alert("Akses ditolak! Akun atau Password salah.");
        return; 
    }
    try { localStorage.setItem("isLoggedIn", "true"); } catch(e){}
    document.getElementById("loginSection").classList.add("hidden");
    document.getElementById("mainAppSection").classList.remove("hidden");
    renderTable();
}

function handleLogout() {
    if(confirm("Apakah Anda yakin ingin keluar?")) {
        try { localStorage.removeItem("isLoggedIn"); } catch(e){}
        document.getElementById("mainAppSection").classList.add("hidden");
        document.getElementById("loginSection").classList.remove("hidden");
    }
}

function checkLoginSession() {
    if(localStorage.getItem("isLoggedIn") === "true") {
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("mainAppSection").classList.remove("hidden");
        renderTable();
    }
}

function getTanggalLaptopRealtime() {
    const today = new Date();
    return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
}

function renderTable() {
    let html = "";
    if(dataRekap.length === 0) {
        html = "<tr><td colspan='5' style='text-align:center; color:#94a3b8;'>Belum ada data rekap.</td></tr>";
    } else {
        dataRekap.forEach((item, index) => {
            let totalTeks = item.hadir === TOTAL_PERTEMUAN 
                ? `<span class="total-lengkap">LENGKAP</span>` 
                : `<span class="total-fraction">${item.hadir}/${TOTAL_PERTEMUAN}</span>`;

            html += `
            <tr>
                <td style="font-weight: 500;">${item.nama}</td>
                <td>
                    <div class="counter-box">
                        <button class="counter-btn" onclick="updateCounter(${index}, 'hadir', -1)">-</button>
                        <span class="counter-val hadir-val">${item.hadir}</span>
                        <button class="counter-btn" onclick="updateCounter(${index}, 'hadir', 1)">+</button>
                    </div>
                </td>
                <td>
                    <div class="counter-box">
                        <button class="counter-btn" onclick="updateCounter(${index}, 'tidakHadir', -1)">-</button>
                        <span class="counter-val tidak-val">${item.tidakHadir}</span>
                        <button class="counter-btn" onclick="updateCounter(${index}, 'tidakHadir', 1)">+</button>
                    </div>
                </td>
                <td>${totalTeks}</td>
                <td>
                    <div class="actions-cell">
                        <button class="btn-action btn-excel" title="Download Excel Harian Siswa" onclick="exportSiswaExcel(${index})"><i class="fa fa-file-excel"></i></button>
                        <button class="btn-action btn-pdf" title="Download PDF Harian Siswa" onclick="exportSiswaPDF(${index})"><i class="fa fa-file-pdf"></i></button>
                        <button class="btn-action btn-delete" title="Hapus Data Siswa" id="btnDelete-${index}" onclick="deleteRow(${index})"><i class="fa fa-trash"></i></button>
                    </div>
                </td>
            </tr>`;
        });
    }
    document.getElementById("tbody").innerHTML = html;
    document.getElementById("totalPertemuanText").innerText = `Total ${TOTAL_PERTEMUAN} Pertemuan Les Renang`;
}

async function updateCounter(index, tipe, value) {
    const namaSiswa = dataRekap[index].nama;
    const tanggalRealtime = getTanggalLaptopRealtime();
    let statusDikirim = "";
    let catatanKetik = "";

    if (value > 0) {
        statusDikirim = (tipe === 'hadir') ? "Hadir" : "Tidak Hadir";
        let inputCatatan = prompt(`Masukkan Catatan Baru untuk ${namaSiswa}:`, `Update manual via counter`);
        if (inputCatatan === null) return; 
        catatanKetik = inputCatatan.trim() === "" ? `Update manual via counter` : inputCatatan.trim();
        if (tipe === 'hadir') dataRekap[index].hadir += 1;
        else dataRekap[index].tidakHadir += 1;
    } else {
        if (tipe === 'hadir') {
            if (dataRekap[index].hadir === 0) return;
            dataRekap[index].hadir -= 1;
            statusDikirim = "Kurang Hadir";
        } else {
            if (dataRekap[index].tidakHadir === 0) return;
            dataRekap[index].tidakHadir -= 1;
            statusDikirim = "Kurang Tidak Hadir";
        }
        catatanKetik = `Pengurangan manual via counter`;
    }

    renderTable();
    await sendToCloud(namaSiswa, statusDikirim, tanggalRealtime, catatanKetik);
    try { localStorage.setItem("dataRekap", JSON.stringify(dataRekap)); } catch(e){}
}

async function deleteRow(index) {
    const namaSiswa = dataRekap[index].nama;
    if(!confirm(`Hapus seluruh data siswa ${namaSiswa}?`)) return;
    
    const btnDelete = document.getElementById(`btnDelete-${index}`);
    if(btnDelete) btnDelete.innerHTML = '<i class="fa fa-spinner fa-spin"></i>';

    const urlEncoded = new URLSearchParams();
    urlEncoded.append("action", "deleteSiswa");
    urlEncoded.append("nama", namaSiswa);

    try {
        await fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", body: urlEncoded });
        dataRekap.splice(index, 1);
        try { localStorage.setItem("dataRekap", JSON.stringify(dataRekap)); } catch(e){}
        renderTable();
    } catch (err) {
        alert(`Gagal koneksi cloud.`);
        renderTable();
    }
}

async function simpan() {
    let nama = selectNamaControl ? selectNamaControl.getValue() : document.getElementById("nama").value;
    const status = document.getElementById("status").value;
    const catatan = document.getElementById("catatan").value;
    const btnSimpan = document.getElementById("btnSimpan");
    const tanggalRealtime = getTanggalLaptopRealtime();

    if (!nama || nama === "") { 
        alert("Silakan pilih atau ketik nama siswa terlebih dahulu!"); 
        return; 
    }

    btnSimpan.disabled = true;
    btnSimpan.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Mengirim ke Cloud...';
    let catatanTeks = catatan.trim() ? catatan.trim() : `Absen pada tanggal ${tanggalRealtime}`;

    try {
        const urlEncoded = new URLSearchParams();
        urlEncoded.append("nama", nama);
        urlEncoded.append("status", status);
        urlEncoded.append("tanggal", tanggalRealtime);
        urlEncoded.append("catatan", catatanTeks);
        await fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", body: urlEncoded });
    } catch(e) {}

    let siswaExist = dataRekap.find(s => s.nama === nama);
    if(siswaExist) {
        if(status === "Hadir") siswaExist.hadir += 1;
        else siswaExist.tidakHadir += 1;
        siswaExist.catatan = catatanTeks; 
        siswaExist.tanggal = tanggalRealtime;
    } else {
        dataRekap.push({ nama: nama, hadir: status === "Hadir" ? 1 : 0, tidakHadir: status === "Tidak Hadir" ? 1 : 0, tanggal: tanggalRealtime, catatan: catatanTeks });
    }
    
    renderTable();
    try { localStorage.setItem("dataRekap", JSON.stringify(dataRekap)); } catch(e){}

    if(selectNamaControl) { selectNamaControl.clear(); }
    document.getElementById("catatan").value = "";
    btnSimpan.disabled = false;
    btnSimpan.innerHTML = '<i class="fa fa-plus-circle"></i> Simpan Data';
    
    alert("Data berhasil diproses ke cloud!");
}

async function sendToCloud(nama, status, tanggal, catatan) {
    const urlEncoded = new URLSearchParams();
    urlEncoded.append("nama", nama);
    urlEncoded.append("status", status);
    urlEncoded.append("tanggal", tanggal);
    urlEncoded.append("catatan", catatan);
    try { await fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", body: urlEncoded }); } catch(e) {}
}

async function resetSemuaData() {
    if (confirm("Hapus seluruh data di aplikasi dan spreadsheet?")) {
        const urlEncoded = new URLSearchParams();
        urlEncoded.append("action", "clear");
        try {
            await fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", body: urlEncoded });
            dataRekap = [];
            try { localStorage.removeItem("dataRekap"); } catch(e){}
            renderTable();
            alert("Data dikosongkan.");
        } catch (err) { alert("Gagal koneksi cloud."); }
    }
}

/* --- TABS SYSTEM --- */
function showTab(tab, btn) {
    document.getElementById("input").classList.add("hidden");
    document.getElementById("rekap").classList.add("hidden");
    document.getElementById(tab).classList.remove("hidden");
    document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
    btn.classList.add("active");
}

/* --- PERBAIKAN KHUSUS UNTUK APK ANDROID AGAR TIDAK FORCE CLOSE --- */
function prosesUnduhFile(blob, namaFile) {
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    if (isMobile) {
        const reader = new FileReader();
        reader.onloadend = function() {
            const dataUrl = reader.result;
            
            const w = window.open();
            if (w) {
                w.document.write(`
                    <html lang="id">
                    <head>
                        <meta name="viewport" content="width=device-width, initial-scale=1.0">
                        <title>Unduh File NSC</title>
                        <style>
                            body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 40px 20px; background: #f4f6f9; color: #1e3a63; }
                            .box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
                            .btn-download { display: inline-block; background: #234a84; color: white; padding: 14px 25px; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 20px; box-shadow: 0 4px 6px rgba(35,74,132,0.2); }
                            .info { color: #64748b; font-size: 14px; margin-top: 15px; }
                        </style>
                    </head>
                    <body>
                        <div class="box">
                            <h3>File Berhasil Disiapkan!</h3>
                            <p>Silakan klik tombol di bawah untuk menyimpan berkas ke perangkat Anda.</p>
                            <a href="${dataUrl}" download="${namaFile}" class="btn-download">⬇️ SIMPAN FILE SEKARANG</a>
                            <p class="info">Nama File: <br><strong>${namaFile}</strong></p>
                        </div>
                    </body>
                    </html>
                `);
                w.document.close();
            } else {
                alert("Gagal membuka browser luar. Mohon aktifkan izin pop-up / buka link luar di pengaturan aplikasi webview Anda.");
            }
        };
        reader.readAsDataURL(blob);
    } else {
        try {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = namaFile;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        } catch(e) {
            alert("Gagal mengunduh file.");
        }
    }
}

function exportTotalExcel() {
    if(dataRekap.length === 0) return alert("Tidak ada data untuk diekspor");
    const worksheetData = [["Nama Siswa", "Hadir", "Tidak Hadir", "Total Pertemuan", "Tanggal Terbaru", "Catatan Terakhir"]];
    dataRekap.forEach(item => { 
        worksheetData.push([item.nama, item.hadir, item.tidakHadir, `${item.hadir}/${TOTAL_PERTEMUAN}`, item.tanggal || '-', item.catatan || '-']); 
    });
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(worksheetData);
    XLSX.utils.book_append_sheet(wb, ws, "Rekap Total NSC");
    const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    const blob = new Blob([wbout], { type: 'application/octet-stream' });
    prosesUnduhFile(blob, "Rekap_Total_Kehadiran_NSC.xlsx");
}
