<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Les Renang NSC</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body { background: #f4f6f9; }
        .header { background: #234a84; color: white; padding: 20px 30px; }
        .header h1 { font-size: 28px; margin-bottom: 5px; }
        .header p { opacity: .8; }
        .container { padding: 25px; max-width: 1100px; margin: auto; }
        .tabs { display: flex; gap: 15px; margin-bottom: 20px; }
        .tab-btn {
            padding: 12px 25px; border: none; border-radius: 30px; font-size: 16px;
            cursor: pointer; background: #dbe3ef; color: #5c6f8a;
            display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s;
        }
        .tab-btn.active { background: #1e3a63; color: white; }
        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 2px 10px rgba(0,0,0,.05); border: 1px solid #e2e8f0; }
        .rekap-header-wrapper { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; width: 100%; gap: 15px; }
        .rekap-title-area h2 { color: #1e293b; font-size: 22px; margin-bottom: 4px; }
        .rekap-title-area p { color: #64748b; font-size: 14px; }
        .rekap-controls-area { display: flex; align-items: center; gap: 15px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #4d5c75; }
        select, input[type="text"], textarea { width: 100%; padding: 14px; border: 1px solid #d7dde7; border-radius: 10px; font-size: 16px; }
        textarea { resize: none; }
        .btn { color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; transition: opacity 0.2s; white-space: nowrap; }
        .btn:hover { opacity: .9; }
        .btn-primary { background: #234a84; padding: 14px 25px; font-size: 16px; border-radius: 10px; margin-top: 20px; }
        .hidden { display: none; }
        .table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .table th { background: #f8fafc; padding: 14px; text-align: left; color: #334155; font-weight: 600; border-bottom: 1px solid #e2e8f0; }
        .table td { padding: 16px 14px; border-bottom: 1px solid #f1f5f9; color: #1e293b; vertical-align: middle; }
        .export { display: flex; gap: 10px; align-items: flex-end; }
        .csv { background: #22c55e; }
        .pdf { background: #f97316; }
        .reset { background: #dc2626; }
        .counter-box { display: inline-flex; align-items: center; background: #e2e8f0; border-radius: 6px; padding: 2px; gap: 8px; }
        .counter-btn { background: #cbd5e1; border: none; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-weight: bold; color: #475569; display: flex; align-items: center; justify-content: center; }
        .counter-btn:hover { background: #94a3b8; }
        .counter-val { font-weight: 600; min-width: 15px; text-align: center; }
        .counter-val.hadir-val { color: #16a34a; }
        .counter-val.tidak-val { color: #dc2626; }
        .total-fraction { font-weight: 600; color: #ea580c; }
        .total-lengkap { font-weight: bold; color: #16a34a; background: #dcfce7; padding: 4px 10px; border-radius: 20px; font-size: 13px; }
        .actions-cell { display: flex; gap: 6px; }
        .btn-action { width: 32px; height: 32px; border-radius: 6px; border: none; color: white; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; }
        .btn-view { background: #22c55e; }
        .btn-download { background: #f97316; }
        .btn-delete { background: #ef4444; }
    </style>
</head>
<body>

<div class="header">
    <h1>Absensi Les Renang</h1>
    <p>Nona Swimming Course</p>
</div>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('input', this)">
            <i class="fa fa-clipboard-check"></i> Input Absensi
        </button>
        <button class="tab-btn" onclick="showTab('rekap', this)">
            <i class="fa fa-chart-column"></i> Rekap Data
        </button>
    </div>

    <div id="input" class="card">
        <h2>Tambah Absensi</h2>
        <div class="row">
            <div>
                <label for="nama">Nama Siswa</label>
                <input type="text" id="nama" list="list-nama" placeholder="Ketik atau pilih nama..." autocomplete="off">
                <datalist id="list-nama">
                    <option value="KALINGGA"></option>
                    <option value="ZIDNI"></option>
                    <option value="KALA"></option>
                    <option value="EGA"></option>
                    <option value="ARGHYA"></option>
                    <option value="AIRA"></option>
                    <option value="ALDEBARAN"></option>
                    <option value="ASHIMA"></option>
                    <option value="BINTANG"></option>
                    <option value="BRANDEN"></option>
                    <option value="CECIL"></option>
                    <option value="DHIFA"></option>
                    <option value="FAISAL"></option>
                    <option value="HAFIZ"></option>
                    <option value="ICHA"></option>
                    <option value="KAMIL"></option>
                    <option value="KECIL"></option>
                    <option value="KHSAN"></option>
                    <option value="KEANO"></option>
                    <option value="ALFA"></option>
                    <option value="RISKI"></option>
                    <option value="KIRAN"></option>
                    <option value="NAJMA"></option>
                    <option value="NAURA"></option>
                    <option value="NAZLA"></option>
                    <option value="RISYA"></option>
                    <option value="IRUL"></option>
                    <option value="UMMA"></option>
                    <option value="YUMNA"></option>
                    <option value="RAFFA"></option>
                    <option value="ZULFA"></option>
                </datalist>
            </div>
            <div>
                <label for="status">Status</label>
                <select id="status">
                    <option value="Hadir">Hadir</option>
                    <option value="Tidak Hadir">Tidak Hadir</option>
                </select>
            </div>
        </div>
        <br>
        <label for="catatan">Catatan</label>
        <textarea rows="3" id="catatan" placeholder="Tambahkan catatan khusus di sini..."></textarea>
        <button class="btn btn-primary" id="btnSimpan" onclick="simpan()">
            <i class="fa fa-plus-circle"></i> Simpan Data
        </button>
    </div>

    <div id="rekap" class="card hidden">
        <div class="rekap-header-wrapper">
            <div class="rekap-title-area">
                <h2>Rekap Kehadiran</h2>
                <p id="totalPertemuanText">Total 12 Pertemuan Les Renang</p>
            </div>
            
            <div class="rekap-controls-area">
                <div class="export">
                    <button class="btn reset" id="btnResetAll" onclick="resetSemuaData()">
                        <i class="fa fa-trash-can"></i> Reset Semua Data
                    </button>
                    <button class="btn csv" onclick="exportToCSV()">
                        <i class="fa fa-file-csv"></i> Export CSV
                    </button>
                    <button class="btn pdf" onclick="exportToPDF()">
                        <i class="fa fa-file-pdf"></i> Export PDF
                    </button>
                </div>
            </div>
        </div>
        
        <table class="table">
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Hadir</th>
                    <th>Tidak Hadir</th>
                    <th>Total</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
</div>

<script>
const TOTAL_PERTEMUAN = 12;
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbysMb6Uy0k3I6JIIFhuL8ySZ2-1rA1dXsrBQ6J5F9QvKb-uJ4rdu_jr537hT3YitBAlMA/exec";

let dataRekap = JSON.parse(localStorage.getItem("dataRekap")) || [
    { nama: "KALINGGA", hadir: 1, tidakHadir: 0, catatan: "Sesi Pertama" },
    { nama: "ZIDNI", hadir: 1, tidakHadir: 0, catatan: "Sesi Pertama" }
];

function getTanggalLaptopRealtime() {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
}

function simpanKeLocalStorage() {
    localStorage.setItem("dataRekap", JSON.stringify(dataRekap));
}

function renderTable() {
    let html = "";
    if(dataRekap.length === 0) {
        html = "<tr><td colspan='5' style='text-align:center; color:#94a3b8;'>Belum ada data rekap.</td></tr>";
    } else {
        dataRekap.forEach((item, index) => {
            let totalTeks = item.hadir === TOTAL_PERTEMUAN 
                ? `<span class="total-lengkap">LENGKAP</span>` 
                : `<span class="total-fraction">${item.hadir}/${TOTAL_PERTEMUAN}</span>`;

            let catatanTeks = item.catatan ? item.catatan : "-";

            html += `
            <tr>
                <td style="font-weight: 500;">${item.nama}</td>
                <td>
                    <div class="counter-box">
                        <button class="counter-btn" onclick="updateCounter(${index}, 'hadir', -1)">-</button>
                        <span class="counter-val hadir-val">${item.hadir}</span>
                        <button class="counter-btn" onclick="updateCounter(${index}, 'hadir', 1)">+</button>
                    </div>
                </td>
                <td>
                    <div class="counter-box">
                        <button class="counter-btn" onclick="updateCounter(${index}, 'tidakHadir', -1)">-</button>
                        <span class="counter-val tidak-val">${item.tidakHadir}</span>
                        <button class="counter-btn" onclick="updateCounter(${index}, 'tidakHadir', 1)">+</button>
                    </div>
                </td>
                <td>${totalTeks}</td>
                <td>
                    <div class="actions-cell">
                        <button class="btn-action btn-view" title="Detail Catatan" onclick="alert('Catatan untuk ${item.nama}:\\n${catatanTeks}')"><i class="fa fa-file-text"></i></button>
                        <button class="btn-action btn-download" title="Download Baris Ini" onclick="exportRowToCSV(${index})"><i class="fa fa-download"></i></button>
                        <button class="btn-action btn-delete" title="Hapus Data Siswa" id="btnDelete-${index}" onclick="deleteRow(${index})"><i class="fa fa-trash"></i></button>
                    </div>
                </td>
            </tr>`;
        });
    }
    document.getElementById("tbody").innerHTML = html;
    document.getElementById("totalPertemuanText").innerText = `Total ${TOTAL_PERTEMUAN} Pertemuan Les Renang`;
}

async function updateCounter(index, tipe, value) {
    const namaSiswa = dataRekap[index].nama;
    const tanggalRealtime = getTanggalLaptopRealtime();
    let statusDikirim = "";
    let catatanKetik = "";

    if (value > 0) {
        if (tipe === 'hadir') {
            statusDikirim = "Hadir";
        } else {
            statusDikirim = "Tidak Hadir";
        }
        
        let inputCatatan = prompt(`Masukkan Catatan Baru untuk ${namaSiswa} (${statusDikirim}) pada tanggal ${tanggalRealtime}:`, `Update manual via counter`);
        
        if (inputCatatan === null) {
            return; 
        }
        
        catatanKetik = inputCatatan.trim() === "" ? `Update manual via counter` : inputCatatan.trim();
        
        if (tipe === 'hadir') dataRekap[index].hadir += 1;
        else dataRekap[index].tidakHadir += 1;

    } else {
        if (tipe === 'hadir') {
            if (dataRekap[index].hadir === 0) return;
            
            // Logika Deteksi Hadir = 0
            if (dataRekap[index].hadir - 1 === 0) {
                let konfirmasiHapus = confirm(`Nilai hadir ${namaSiswa} akan menjadi 0. Apakah Anda ingin langsung menghapus seluruh data siswa ini dari sistem?`);
                if (konfirmasiHapus) {
                    await deleteRow(index); // Jalankan fungsi hapus data cloud & lokal
                    return; // Keluar dari fungsi agar tidak memproses baris kode di bawahnya
                } else {
                    return; // Batalkan pengurangan jika user menolak menghapus
                }
            }
            
            dataRekap[index].hadir -= 1;
            statusDikirim = "Kurang Hadir";
        } else {
            if (dataRekap[index].tidakHadir === 0) return;
            dataRekap[index].tidakHadir -= 1;
            statusDikirim = "Kurang Tidak Hadir";
        }
        catatanKetik = `Pengurangan manual via counter`;
    }

    dataRekap[index].catatan = catatanKetik;
    
    simpanKeLocalStorage(); 
    renderTable();

    const urlEncoded = new URLSearchParams();
    urlEncoded.append("nama", namaSiswa);
    urlEncoded.append("status", statusDikirim);
    urlEncoded.append("tanggal", tanggalRealtime);
    urlEncoded.append("catatan", catatanKetik);

    try {
        await fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            body: urlEncoded,
            headers: { "Content-Type": "application/x-www-form-urlencoded" }
        });
    } catch (err) {
        console.error("Gagal sinkronisasi data ke Cloud:", err);
    }
}

async function deleteRow(index) {
    const namaSiswa = dataRekap[index].nama;
    const btnDelete = document.getElementById(`btnDelete-${index}`);
    if(btnDelete) {
        btnDelete.disabled = true;
        btnDelete.innerHTML = '<i class="fa fa-spinner fa-spin"></i>';
    }

    const urlEncoded = new URLSearchParams();
    urlEncoded.append("action", "deleteSiswa");
    urlEncoded.append("nama", namaSiswa);

    try {
        await fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            body: urlEncoded,
            headers: { "Content-Type": "application/x-www-form-urlencoded" }
        });

        dataRekap.splice(index, 1);
        simpanKeLocalStorage(); 
        renderTable();
        alert(`Data rekap untuk ${namaSiswa} berhasil dihapus dari Cloud dan Aplikasi.`);
    } catch (err) {
        console.error(err);
        alert(`Gagal menghapus data ${namaSiswa} di Google Spreadsheet. Periksa koneksi internet Anda.`);
        renderTable();
    }
}

async function simpan() {
    const namaInput = document.getElementById("nama").value.trim();
    const nama = namaInput.toUpperCase(); 
    const status = document.getElementById("status").value;
    const catatan = document.getElementById("catatan").value;
    const btnSimpan = document.getElementById("btnSimpan");
    
    const tanggalRealtime = getTanggalLaptopRealtime();

    if (!nama) {
        alert("Ketik atau pilih nama siswa terlebih dahulu!");
        return;
    }

    btnSimpan.disabled = true;
    btnSimpan.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Menyimpan...';

    let siswaExist = dataRekap.find(s => s.nama === nama);
    let catatanTeks = catatan ? catatan : `Absen pada tanggal ${tanggalRealtime}`;

    if(siswaExist) {
        if(status === "Hadir") siswaExist.hadir += 1;
        else siswaExist.tidakHadir += 1;
        siswaExist.catatan = catatanTeks; 
    } else {
        dataRekap.push({ 
            nama: nama, 
            hadir: status === "Hadir" ? 1 : 0, 
            tidakHadir: status === "Tidak Hadir" ? 1 : 0,
            catatan: catatanTeks
        });
    }
    
    simpanKeLocalStorage(); 
    renderTable();

    const urlEncoded = new URLSearchParams();
    urlEncoded.append("nama", nama);
    urlEncoded.append("status", status);
    urlEncoded.append("tanggal", tanggalRealtime); 
    urlEncoded.append("catatan", catatanTeks);

    try {
        await fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            body: urlEncoded,
            headers: { "Content-Type": "application/x-www-form-urlencoded" }
        });
        alert("Data berhasil disimpan ke Cloud!");
        document.getElementById("nama").value = "";
        document.getElementById("catatan").value = "";
    } catch (err) {
        console.error(err);
        alert("Gagal sinkronisasi cloud, data lokal diperbarui.");
    } finally {
        btnSimpan.disabled = false;
        btnSimpan.innerHTML = '<i class="fa fa-plus-circle"></i> Simpan Data';
    }
}

async function resetSemuaData() {
    if (confirm("Apakah Anda yakin ingin mereset SELURUH data rekap semua siswa? Semua data di aplikasi dan Google Spreadsheet akan terhapus total.")) {
        const btnReset = document.getElementById("btnResetAll");
        btnReset.disabled = true;
        btnReset.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Menghapus Cloud...';

        const urlEncoded = new URLSearchParams();
        urlEncoded.append("action", "clear");

        try {
            await fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                body: urlEncoded,
                headers: { "Content-Type": "application/x-www-form-urlencoded" }
            });

            dataRekap = [];
            simpanKeLocalStorage();
            renderTable();
            alert("Seluruh data rekap dan Google Spreadsheet berhasil dikosongkan!");
        } catch (err) {
            console.error(err);
            alert("Koneksi gagal. Gagal mereset data di Google Spreadsheet.");
        } finally {
            btnReset.disabled = false;
            btnReset.innerHTML = '<i class="fa fa-trash-can"></i> Reset Semua Data';
        }
    }
}

function showTab(tab, btn) {
    document.getElementById("input").classList.add("hidden");
    document.getElementById("rekap").classList.add("hidden");
    document.getElementById(tab).classList.remove("hidden");
    document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
    btn.classList.add("active");
}

function exportToCSV() {
    let csvContent = "data:text/csv;charset=utf-8,Nama,Hadir,Tidak Hadir,Total,Catatan\n";
    dataRekap.forEach(item => {
        let totalVal = item.hadir === TOTAL_PERTEMUAN ? "LENGKAP" : `${item.hadir}/${TOTAL_PERTEMUAN}`;
        csvContent += `${item.nama},${item.hadir},${item.tidakHadir},${totalVal},"${item.catatan || '-'}"\n`;
    });
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "Rekap_Kehadiran_NSC.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function exportRowToCSV(index) {
    const item = dataRekap[index];
    let csvContent = "data:text/csv;charset=utf-8,Nama,Hadir,Tidak Hadir,Total,Catatan\n";
    let totalVal = item.hadir === TOTAL_PERTEMUAN ? "LENGKAP" : `${item.hadir}/${TOTAL_PERTEMUAN}`;
    csvContent += `${item.nama},${item.hadir},${item.tidakHadir},totalVal,"${item.catatan || '-'}"\n`;
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `Rekap_${item.nama}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function exportToPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.text("Rekap Kehadiran Nona Swimming Course", 14, 15);
    doc.setFontSize(10);
    doc.text(`Total Pertemuan Kursus: ${TOTAL_PERTEMUAN}`, 14, 22);
    const tableRows = [];
    dataRekap.forEach(item => {
        let totalVal = item.hadir === TOTAL_PERTEMUAN ? "LENGKAP" : `${item.hadir}/${TOTAL_PERTEMUAN}`;
        tableRows.push([item.nama, item.hadir, item.tidakHadir, totalVal, item.catatan || '-']);
    });
    doc.autoTable({ startY: 28, head: [['Nama', 'Hadir', 'Tidak Hadir', 'Total', 'Catatan']], body: tableRows });
    doc.save("Rekap_Kehadiran_NSC.pdf");
}

window.onload = function() { 
    renderTable(); 
};
</script>
</body>
</html>
