<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Les Renang NSC</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body { background: #f4f6f9; min-height: 100vh; }
        
        /* STYLE HALAMAN LOGIN */
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: #eef2f7;
        }
        .login-card {
            background: white;
            padding: 35px 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,.08);
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.5s ease-in-out;
            text-align: center;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Kontainer Logo Halaman Login - Diubah agar Kotak/Asli */
        .login-logo-container {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }
        .login-logo {
            width: 110px;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .login-card h2 { color: #1e3a63; font-size: 26px; margin-bottom: 8px; font-weight: 700; }
        .login-card p { color: #64748b; font-size: 14px; margin-bottom: 30px; }
        .login-form-group { margin-bottom: 20px; text-align: left; }
        
        /* Wrapper Password */
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-container input {
            width: 100%;
            padding-right: 45px;
        }
        .toggle-password-btn {
            position: absolute;
            right: 15px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            transition: color 0.2s;
        }
        .toggle-password-btn:hover { color: #475569; }
        
        /* STYLE UTAMA HEADER APLIKASI - Lingkaran Dihapus agar Logo Terlihat Utuh */
        .header { 
            background: #234a84; 
            color: white; 
            padding: 20px 30px; 
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .header-logo {
            width: 70px;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            background: transparent;
        }
        .header-text h1 { font-size: 28px; margin-bottom: 3px; }
        .header-text p { opacity: .8; }
        
        .container { padding: 25px; max-width: 1100px; margin: auto; }
        
        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }
        .tabs { display: flex; gap: 15px; flex-wrap: wrap; }
        .tab-btn {
            padding: 12px 25px; border: none; border-radius: 30px; font-size: 16px;
            cursor: pointer; background: #dbe3ef; color: #5c6f8a;
            display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s;
        }
        .tab-btn.active { background: #1e3a63; color: white; }
        
        .logout-main-btn {
            padding: 12px 22px;
            border: 2px solid #ef4444;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
            color: #ef4444;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease-in-out;
        }
        .logout-main-btn:hover { background: #ef4444; color: white; }

        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 2px 10px rgba(0,0,0,.05); border: 1px solid #e2e8f0; }
        
        /* RESPONSIVE REKAP DATA */
        .rekap-header-wrapper { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            width: 100%; 
            gap: 15px; 
            flex-wrap: wrap; 
        }
        .rekap-title-area h2 { color: #1e293b; font-size: 22px; margin-bottom: 4px; }
        .rekap-title-area p { color: #64748b; font-size: 14px; }
        .rekap-controls-area { display: flex; align-items: center; flex-wrap: wrap; }
        .export { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #4d5c75; }
        select, input[type="text"], input[type="email"], input[type="password"], textarea { width: 100%; padding: 14px; border: 1px solid #d7dde7; border-radius: 10px; font-size: 16px; background: white; }
        textarea { resize: none; }
        
        /* Tombol-tombol */
        .btn { 
            color: white; 
            padding: 12px 18px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 500;
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            transition: opacity 0.2s; 
            white-space: nowrap; 
        }
        .btn:hover { opacity: .9; }
        .btn-primary { background: #234a84; padding: 14px 25px; font-size: 16px; border-radius: 10px; margin-top: 20px; }
        .login-btn { width: 100%; background: #234a84; color: white; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .login-btn:hover { background: #1e3a63; }
        
        /* Tabel Data & Pembungkus Responsif */
        .table-wrapper { width: 100%; overflow-x: auto; margin-top: 10px; -webkit-overflow-scrolling: touch; }
        .table { width: 100%; border-collapse: collapse; min-width: 600px; }
        .table th { background: #f8fafc; padding: 14px; text-align: left; color: #334155; font-weight: 600; border-bottom: 1px solid #e2e8f0; }
        .table td { padding: 16px 14px; border-bottom: 1px solid #f1f5f9; color: #1e293b; vertical-align: middle; }
        
        .csv { background: #22c55e; }
        .pdf { background: #f97316; }
        .reset { background: #dc2626; }
        
        /* Counter Angka Absen */
        .counter-box { display: inline-flex; align-items: center; background: #e2e8f0; border-radius: 6px; padding: 2px; gap: 8px; }
        .counter-btn { background: #cbd5e1; border: none; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-weight: bold; color: #475569; display: flex; align-items: center; justify-content: center; }
        .counter-btn:hover { background: #94a3b8; }
        .counter-val { font-weight: 600; min-width: 15px; text-align: center; }
        .counter-val hadir-val { color: #16a34a; }
        .counter-val tidak-val { color: #dc2626; }
        .total-fraction { font-weight: 600; color: #ea580c; }
        .total-lengkap { font-weight: bold; color: #16a34a; background: #dcfce7; padding: 4px 10px; border-radius: 20px; font-size: 13px; }
        
        /* Aksi */
        .actions-cell { display: flex; gap: 6px; }
        .btn-action { width: 32px; height: 32px; border-radius: 6px; border: none; color: white; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; }
        .btn-view { background: #22c55e; }
        .btn-download { background: #f97316; }
        .btn-delete { background: #ef4444; }
        
        .hidden { display: none !important; }
        .login-footer { text-align: center; margin-top: 25px; font-size: 13px; color: #64748b; }

        /* CSS KHUSUS LAYAR HP */
        @media (max-width: 600px) {
            .header { padding: 15px; gap: 12px; }
            .header-logo { width: 55px; }
            .header-text h1 { font-size: 22px; }
            .container { padding: 15px; }
            .row { grid-template-columns: 1fr; gap: 15px; }
            .nav-bar { flex-direction: column; align-items: stretch; gap: 12px; }
            .tabs { width: 100%; }
            .tab-btn { flex: 1; justify-content: center; font-size: 14px; padding: 10px 15px; }
            .logout-main-btn { width: 100%; justify-content: center; }
            .rekap-header-wrapper {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .rekap-controls-area, .export { width: 100%; }
            .export .btn { flex: 1 1 auto; justify-content: center; font-size: 13px; padding: 10px 12px; }
        }
    </style>
</head>
<body>

<!-- 1. SEKSI HALAMAN LOGIN -->

    <div class="login-card">
        <!-- Logo Asli Tanpa Potongan Lingkaran -->
        <div class="login-logo-container">

        </div>

<!-- 2. SEKSI UTAMA APLIKASI -->
<div id="mainAppSection" class="hidden">
    <div class="header">
        <!-- Logo Asli Tanpa Potongan Lingkaran -->
        <img src="Logo percobaan.png" alt="Logo NSC" class="header-logo">

            <h1>Absensi Les Renang</h1>

    </div>

    <div class="container">

<script>
const TOTAL_PERTEMUAN = 12;
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbysMb6Uy0k3I6JIIFhuL8ySZ2-1rA1dXsrBQ6J5F9QvKb-uJ4rdu_jr537hT3YitBAlMA/exec";

let dataRekap = JSON.parse(localStorage.getItem("dataRekap")) || [
    { nama: "KALINGGA", hadir: 1, tidakHadir: 0, catatan: "Sesi Pertama" },
    { nama: "ZIDNI", hadir: 1, tidakHadir: 0, catatan: "Sesi Pertama" }
];

function togglePasswordVisibility() {
    const passwordInput = document.getElementById("loginPassword");
    const eyeIcon = document.getElementById("eyeIcon");
    
    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        eyeIcon.classList.remove("fa-eye");
        eyeIcon.classList.add("fa-eye-slash");
    } else {
        passwordInput.type = "password";
        eyeIcon.classList.remove("fa-eye-slash");
        eyeIcon.classList.add("fa-eye");
    }
}

async function generateSHA256(string) {
    const msgBuffer = new TextEncoder().encode(string);                    
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function handleLogin(event) {
    event.preventDefault(); 
    
    const email = document.getElementById("loginEmail").value.trim().toLowerCase();
    const password = document.getElementById("loginPassword").value;

    const emailSah = "nonaswimmingcourse@gmail.com";
    const hashPasswordSah = "3d32f1b4eec6aac2520a664ae8b746e46f83d5baecf81e030e47a9db5c8c7c83"; 

    const hashInputUser = await generateSHA256(password);

    if (email !== emailSah || hashInputUser !== hashPasswordSah) {
        alert("Akses ditolak! Alamat Gmail atau Password salah.");
        return; 
    }

    localStorage.setItem("isLoggedIn", "true");
    document.getElementById("loginSection").classList.add("hidden");
    document.getElementById("mainAppSection").classList.remove("hidden");
    renderTable();
}

function handleLogout() {
    if(confirm("Apakah Anda yakin ingin keluar dari sistem?")) {
        localStorage.removeItem("isLoggedIn");
        document.getElementById("mainAppSection").classList.add("hidden");
        document.getElementById("loginSection").classList.remove("hidden");
        
        document.getElementById("loginEmail").value = "";
        document.getElementById("loginPassword").value = "";
        
        document.getElementById("loginPassword").type = "password";
        document.getElementById("eyeIcon").className = "fa fa-eye";
    }
}

function checkLoginSession() {
    const session = localStorage.getItem("isLoggedIn");
    if(session === "true") {
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("mainAppSection").classList.remove("hidden");
        renderTable();
    } else {
        document.getElementById("loginSection").classList.remove("hidden");
        document.getElementById("mainAppSection").classList.add("hidden");
    }
}

function getTanggalLaptopRealtime() {
    const today = new Date();
    return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
}

function simpanKeLocalStorage() {
    localStorage.setItem("dataRekap", JSON.stringify(dataRekap));
}

function renderTable() {
    let html = "";
    if(dataRekap.length === 0) {
        html = "<tr><td colspan='5' style='text-align:center; color:#94a3b8;'>Belum ada data rekap.</td></tr>";
    } else {
        dataRekap.forEach((item, index) => {
            let totalTeks = item.hadir === TOTAL_PERTEMUAN 
                ? `<span class="total-lengkap">LENGKAP</span>` 
                : `<span class="total-fraction">${item.hadir}/${TOTAL_PERTEMUAN}</span>`;

            let catatanTeks = item.catatan ? item.catatan : "-";

            html += `
            <tr>
                <td style="font-weight: 500;">${item.nama}</td>
                <td>
                    <div class="counter-box">
                        <button class="counter-btn" onclick="updateCounter(${index}, 'hadir', -1)">-</button>
                        <span class="counter-val hadir-val">${item.hadir}</span>
                        <button class="counter-btn" onclick="updateCounter(${index}, 'hadir', 1)">+</button>
                    </div>
                </td>
                <td>
                    <div class="counter-box">
                        <button class="counter-btn" onclick="updateCounter(${index}, 'tidakHadir', -1)">-</button>
                        <span class="counter-val tidak-val">${item.tidakHadir}</span>
                        <button class="counter-btn" onclick="updateCounter(${index}, 'tidakHadir', 1)">+</button>
                    </div>
                </td>
                <td>${totalTeks}</td>
                <td>
                    <div class="actions-cell">
                        <button class="btn-action btn-view" title="Detail Catatan" onclick="alert('Catatan untuk ${item.nama}:\\n${catatanTeks}')"><i class="fa fa-file-text"></i></button>
                        <button class="btn-action btn-download" title="Download Baris Ini" onclick="exportRowToCSV(${index})"><i class="fa fa-download"></i></button>
                        <button class="btn-action btn-delete" title="Hapus Data Siswa" id="btnDelete-${index}" onclick="deleteRow(${index})"><i class="fa fa-trash"></i></button>
                    </div>
                </td>
            </tr>`;
        });
    }
    document.getElementById("tbody").innerHTML = html;
    document.getElementById("totalPertemuanText").innerText = `Total ${TOTAL_PERTEMUAN} Pertemuan Les Renang`;
}

async function updateCounter(index, tipe, value) {
    const namaSiswa = dataRekap[index].nama;
    const tanggalRealtime = getTanggalLaptopRealtime();
    let statusDikirim = "";
    let catatanKetik = "";

    if (value > 0) {
        statusDikirim = (tipe === 'hadir') ? "Hadir" : "Tidak Hadir";
        let inputCatatan = prompt(`Masukkan Catatan Baru untuk ${namaSiswa} (${statusDikirim}) pada tanggal ${tanggalRealtime}:`, `Update manual via counter`);
        if (inputCatatan === null) return; 
        catatanKetik = inputCatatan.trim() === "" ? `Update manual via counter` : inputCatatan.trim();
        
        if (tipe === 'hadir') dataRekap[index].hadir += 1;
        else dataRekap[index].tidakHadir += 1;
    } else {
        if (tipe === 'hadir') {
            if (dataRekap[index].hadir === 0) return;
            if (dataRekap[index].hadir - 1 === 0) {
                if (confirm(`Nilai hadir ${namaSiswa} akan menjadi 0. Hapus data siswa ini?`)) {
                    await deleteRow(index); 
                    return; 
                } else return;
            }
            dataRekap[index].hadir -= 1;
            statusDikirim = "Kurang Hadir";
        } else {
            if (dataRekap[index].tidakHadir === 0) return;
            dataRekap[index].tidakHadir -= 1;
            statusDikirim = "Kurang Tidak Hadir";
        }
        catatanKetik = `Pengurangan manual via counter`;
    }

    dataRekap[index].catatan = catatanKetik;
    simpanKeLocalStorage(); 
    renderTable();
    sendToCloud(namaSiswa, statusDikirim, tanggalRealtime, catatanKetik);
}

async function deleteRow(index) {
    const namaSiswa = dataRekap[index].nama;
    const btnDelete = document.getElementById(`btnDelete-${index}`);
    if(btnDelete) btnDelete.innerHTML = '<i class="fa fa-spinner fa-spin"></i>';

    const urlEncoded = new URLSearchParams();
    urlEncoded.append("action", "deleteSiswa");
    urlEncoded.append("nama", namaSiswa);

    try {
        await fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", body: urlEncoded });
        dataRekap.splice(index, 1);
        simpanKeLocalStorage(); 
        renderTable();
        alert(`Data ${namaSiswa} dihapus.`);
    } catch (err) {
        alert(`Gagal menghapus data di cloud.`);
        renderTable();
    }
}

async function simpan() {
    const nama = document.getElementById("nama").value.trim().toUpperCase();
    const status = document.getElementById("status").value;
    const catatan = document.getElementById("catatan").value;
    const btnSimpan = document.getElementById("btnSimpan");
    const tanggalRealtime = getTanggalLaptopRealtime();

    if (!nama) { alert("Pilih nama siswa!"); return; }

    btnSimpan.disabled = true;
    btnSimpan.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Menyimpan...';

    let siswaExist = dataRekap.find(s => s.nama === nama);
    let catatanTeks = catatan ? catatan : `Absen pada tanggal ${tanggalRealtime}`;

    if(siswaExist) {
        if(status === "Hadir") siswaExist.hadir += 1;
        else siswaExist.tidakHadir += 1;
        siswaExist.catatan = catatanTeks; 
    } else {
        dataRekap.push({ nama: nama, hadir: status === "Hadir" ? 1 : 0, tidakHadir: status === "Tidak Hadir" ? 1 : 0, catatan: catatanTeks });
    }
    
    simpanKeLocalStorage(); 
    renderTable();
    await sendToCloud(nama, status, tanggalRealtime, catatanTeks);
    
    document.getElementById("nama").value = "";
    document.getElementById("catatan").value = "";
    btnSimpan.disabled = false;
    btnSimpan.innerHTML = '<i class="fa fa-plus-circle"></i> Simpan Data';
}

async function sendToCloud(nama, status, tanggal, catatan) {
    const urlEncoded = new URLSearchParams();
    urlEncoded.append("nama", nama);
    urlEncoded.append("status", status);
    urlEncoded.append("tanggal", tanggal);
    urlEncoded.append("catatan", catatan);
    try {
        await fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", body: urlEncoded });
    } catch(e) { console.log("Cloud error, data tersimpan lokal."); }
}

async function resetSemuaData() {
    if (confirm("Hapus seluruh data di aplikasi dan spreadsheet?")) {
        const urlEncoded = new URLSearchParams();
        urlEncoded.append("action", "clear");
        try {
            await fetch(WEB_APP_URL, { method: "POST", mode: "no-cors", body: urlEncoded });
            dataRekap = [];
            simpanKeLocalStorage();
            renderTable();
            alert("Data dikosongkan.");
        } catch (err) { alert("Gagal koneksi cloud."); }
    }
}

function showTab(tab, btn) {
    document.getElementById("input").classList.add("hidden");
    document.getElementById("rekap").classList.add("hidden");
    document.getElementById(tab).classList.remove("hidden");
    document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
    btn.classList.add("active");
}

function exportToCSV() {
    let csvContent = "data:text/csv;charset=utf-8,Nama,Hadir,Tidak Hadir,Total,Catatan\n";
    dataRekap.forEach(item => {
        let totalVal = item.hadir === TOTAL_PERTEMUAN ? "LENGKAP" : `${item.hadir}/${TOTAL_PERTEMUAN}`;
        csvContent += `${item.nama},${item.hadir},${item.tidakHadir},${totalVal},"${item.catatan || '-'}"\n`;
    });
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "Rekap_Kehadiran_NSC.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function exportRowToCSV(index) {
    const item = dataRekap[index];
    let csvContent = "data:text/csv;charset=utf-8,Nama,Hadir,Tidak Hadir,Total,Catatan\n";
    let totalVal = item.hadir === TOTAL_PERTEMUAN ? "LENGKAP" : `${item.hadir}/${TOTAL_PERTEMUAN}`;
    csvContent += `${item.nama},${item.hadir},${item.tidakHadir},${totalVal},"${item.catatan || '-'}"\n`;
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `Rekap_${item.nama}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function exportToPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    
    doc.setFont("Helvetica", "bold");
    doc.setFontSize(16);
    doc.text("Rekap Kehadiran Siswa", 14, 18);
    
    doc.setFont("Helvetica", "normal");
    doc.setFontSize(11);
    doc.text("Nona Swimming Course (NSC)", 14, 25);
    
    const img = new Image();
    img.src = 'Logo percobaan.png';
    img.onload = function() {
        doc.addImage(img, 'PNG', 165, 10, 30, 30);
        
        const tableRows = [];
        dataRekap.forEach(item => {
            let totalVal = item.hadir === TOTAL_PERTEMUAN ? "LENGKAP" : `${item.hadir}/${TOTAL_PERTEMUAN}`;
            tableRows.push([item.nama, item.hadir, item.tidakHadir, totalVal, item.catatan || '-']);
        });
        
        doc.autoTable({ 
            startY: 45, 
            head: [['Nama', 'Hadir', 'Tidak Hadir', 'Total', 'Catatan']], 
            body: tableRows,
            theme: 'striped',
            headStyles: { fillColor: [35, 74, 132] }
        });
        
        doc.save("Rekap_Kehadiran_NSC.pdf");
    };
    
    img.onerror = function() {
        const tableRows = [];
        dataRekap.forEach(item => {
            let totalVal = item.hadir === TOTAL_PERTEMUAN ? "LENGKAP" : `${item.hadir}/${TOTAL_PERTEMUAN}`;
            tableRows.push([item.nama, item.hadir, item.tidakHadir, totalVal, item.catatan || '-']);
        });
        doc.autoTable({ startY: 35, head: [['Nama', 'Hadir', 'Tidak Hadir', 'Total', 'Catatan']], body: tableRows });
        doc.save("Rekap_Kehadiran_NSC.pdf");
    };
}

    checkLoginSession();
};
